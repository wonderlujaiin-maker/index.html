<title>كيف تسوي محتوى يدخل لك فلوس — By Wonder Lujain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* =====================================================================
     CONFIG — Replace each "" with the URL where you host that file.
     For videos: use Vimeo, YouTube unlisted, Bunny.net, Cloudflare Stream,
       a signed S3 URL, or any direct .mp4 URL.
     For PDFs:   use Google Drive (anyone-with-link), Dropbox, or a direct URL.
     If a URL is left empty, that lesson shows a "Setup pending" placeholder.
  ===================================================================== */
  :root {
    --bg: #f4f4f0;
    --paper: #ffffff;
    --ink: #000000;
    --ink-soft: #1a1a1a;
    --muted: #6b6b6b;
    --line: #000000;
    --pink: #ff90e8;
    --pink-soft: #ffd1f3;
    --yellow: #ffc900;
    --green: #23a094;
    --shadow: 0.25rem 0.25rem 0 var(--ink);
    --shadow-sm: 0.125rem 0.125rem 0 var(--ink);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'IBM Plex Sans Arabic', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 16px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
  a:hover { color: var(--pink); }

  /* Top header */
  .topbar {
    border-bottom: 1px solid var(--line);
    background: var(--paper);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .topbar .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }
  .topbar .logo {
    width: 36px; height: 36px;
    background: var(--pink);
    border: 1px solid var(--line);
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-weight: 700;
    flex-shrink: 0;
  }
  .topbar .title-wrap { min-width: 0; }
  .topbar h1 {
    font-size: 16px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .topbar .author {
    font-size: 13px;
    color: var(--muted);
  }
  .menu-btn {
    display: none;
    border: 1px solid var(--line);
    background: var(--paper);
    padding: 8px 12px;
    font: inherit;
    cursor: pointer;
    border-radius: 4px;
  }

  /* Layout */
  .layout {
    display: grid;
    grid-template-columns: 240px minmax(0, 1fr);
    min-height: calc(100vh - 64px);
  }
  .sidebar {
    border-left: 1px solid var(--line);
    background: var(--paper);
    padding: 16px 0;
    overflow-y: auto;
    position: sticky;
    top: 64px;
    height: calc(100vh - 64px);
  }
  .sidebar-head h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    padding: 0;
    margin-bottom: 10px;
    font-weight: 600;
  }
  .lesson-list { list-style: none; }
  .lesson-list li button {
    display: flex;
    width: 100%;
    align-items: center;
    gap: 10px;
    padding: 12px 18px;
    background: transparent;
    border: none;
    border-top: 1px solid var(--line);
    cursor: pointer;
    font: inherit;
    font-size: 14px;
    text-align: right;
    color: var(--ink);
    transition: background 0.12s;
  }
  .lesson-list li:last-child button { border-bottom: 1px solid var(--line); }
  .lesson-list li button:hover { background: var(--pink-soft); }
  .lesson-list li button.active {
    background: var(--pink);
    font-weight: 600;
  }
  .lesson-list .lesson-num {
    display: inline-grid;
    place-items: center;
    width: 24px; height: 24px;
    border: 1px solid var(--line);
    border-radius: 50%;
    font-size: 12px;
    font-weight: 600;
    background: var(--bg);
    flex-shrink: 0;
  }
  .lesson-list .lesson-title {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .lesson-list .check {
    margin-inline-start: auto;
    color: var(--green);
    font-size: 18px;
    opacity: 0;
  }
  .lesson-list li button.done .check { opacity: 1; }

  /* Main content */
  .main {
    padding: 40px 56px 80px;
    max-width: 1080px;
    width: 100%;
    margin: 0 auto;
  }
  .lesson-header {
    margin-bottom: 32px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--line);
  }
  .lesson-meta {
    font-size: 13px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  .lesson-header h1 {
    font-size: 36px;
    font-weight: 700;
    line-height: 1.2;
  }

  .content > * + * { margin-top: 24px; }
  .content h1 { font-size: 28px; font-weight: 700; }
  .content h2 { font-size: 22px; font-weight: 600; }
  .content h3 { font-size: 18px; font-weight: 600; }
  .content p { font-size: 17px; line-height: 1.8; }
  .content hr {
    border: none;
    border-top: 1px solid var(--line);
    margin: 32px 0;
  }
  .content img {
    max-width: 100%;
    border: 1px solid var(--line);
    border-radius: 4px;
  }
  .content .image-caption {
    margin-top: 8px;
    font-size: 15px;
    color: var(--muted);
    text-align: center;
  }

  /* File embed cards */
  .file-card {
    border: 1px solid var(--line);
    background: var(--paper);
    border-radius: 4px;
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: transform 0.12s, box-shadow 0.12s;
  }
  .file-card:hover { transform: translate(-2px, -2px); box-shadow: 0.375rem 0.375rem 0 var(--ink); }
  .file-card-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
  }
  .file-icon {
    width: 40px; height: 40px;
    display: grid;
    place-items: center;
    border: 1px solid var(--line);
    background: var(--paper);
    border-radius: 4px;
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .file-icon.video { background: var(--pink); }
  .file-icon.pdf { background: var(--yellow); }
  .file-info { flex: 1; min-width: 0; }
  .file-name {
    font-weight: 600;
    font-size: 16px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .file-sub {
    font-size: 13px;
    color: var(--muted);
    margin-top: 2px;
  }
  .file-toggle {
    border: 1px solid var(--line);
    background: var(--paper);
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    transition: background 0.12s;
  }
  .file-toggle:hover { background: var(--pink); }

  .file-body { padding: 0; }
  .file-body.closed { display: none; }
  .file-body video {
    width: 100%;
    max-height: 70vh;
    display: block;
    background: #000;
  }
  .file-body iframe {
    width: 100%;
    height: 70vh;
    min-height: 480px;
    display: block;
    border: 0;
  }
  .file-placeholder {
    padding: 32px 24px;
    text-align: center;
    color: var(--muted);
    background: repeating-linear-gradient(45deg, var(--bg), var(--bg) 10px, var(--paper) 10px, var(--paper) 20px);
  }
  .file-placeholder strong {
    color: var(--ink);
    display: block;
    margin-bottom: 6px;
  }
  .file-placeholder code {
    display: inline-block;
    margin-top: 10px;
    padding: 4px 10px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 3px;
    font-size: 12px;
    direction: ltr;
    user-select: all;
  }

  /* Buttons (links rendered as CTA) */
  .cta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 22px;
    background: var(--pink);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 4px;
    font-weight: 600;
    text-decoration: none;
    box-shadow: var(--shadow-sm);
    transition: transform 0.12s, box-shadow 0.12s;
  }
  .cta:hover {
    transform: translate(-2px, -2px);
    box-shadow: var(--shadow);
    color: var(--ink);
  }
  .cta.secondary { background: var(--paper); }
  .cta.green { background: var(--green); color: white; }
  .cta.green:hover { color: white; }

  .button-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  /* Bonus list styling */
  .bonus-item {
    border: 1px solid var(--line);
    background: var(--paper);
    border-radius: 4px;
    padding: 20px 24px;
    margin-bottom: 16px;
    box-shadow: var(--shadow-sm);
  }
  .bonus-item h3 { margin-bottom: 6px; }
  .bonus-item p { font-size: 16px; margin-bottom: 10px; color: var(--ink-soft); }
  .bonus-item a { font-size: 14px; direction: ltr; display: inline-block; }

  /* Nav footer */
  .lesson-nav {
    margin-top: 56px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    gap: 16px;
  }
  .nav-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border: 1px solid var(--line);
    background: var(--paper);
    border-radius: 4px;
    cursor: pointer;
    font: inherit;
    text-decoration: none;
    color: var(--ink);
    box-shadow: var(--shadow-sm);
    transition: transform 0.12s, box-shadow 0.12s;
    min-width: 0;
  }
  .nav-btn:hover { transform: translate(-2px, -2px); box-shadow: var(--shadow); }
  .nav-btn:disabled, .nav-btn.disabled {
    opacity: 0.4;
    cursor: not-allowed;
    pointer-events: none;
  }
  .nav-btn .label {
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .nav-btn .target {
    font-weight: 600;
    font-size: 15px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .nav-btn .arrow { font-size: 22px; flex-shrink: 0; }

  /* Notice box */
  .notice {
    border: 1px solid var(--line);
    background: var(--bg);
    padding: 16px 20px;
    border-radius: 4px;
    margin-top: 32px;
  }
  .notice h4 { font-weight: 700; margin-bottom: 8px; }
  .notice p { font-size: 15px; line-height: 1.7; }

  /* Progress bar in sidebar header */
  .sidebar-head {
    padding: 12px 18px 14px;
    border-bottom: 1px solid var(--line);
  }
  .sidebar-head h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    font-weight: 600;
    padding: 0;
    margin-bottom: 10px;
  }
  .progress-bar-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .progress-bar-track {
    flex: 1;
    height: 6px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--pink);
    border-radius: 99px;
    transition: width 0.3s ease;
  }
  .progress-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    white-space: nowrap;
  }

  /* Scrim (lives outside the grid, always fixed) */
  .scrim {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 55;
    backdrop-filter: blur(2px);
  }
  .scrim.show { display: block; }

  /* Tablet / smaller laptop */
  @media (max-width: 1100px) {
    .layout { grid-template-columns: 220px minmax(0, 1fr); }
    .main { padding: 28px 28px 64px; }
    .sidebar-head { padding: 10px 14px 12px; }
    .lesson-list li button { padding: 10px 14px; font-size: 13px; }
  }

  /* Mobile / tablet portrait */
  @media (max-width: 820px) {
    .menu-btn { display: inline-flex; }
    .layout { grid-template-columns: 1fr; }
    .sidebar {
      position: fixed;
      inset-inline-start: 0;  /* right: 0 in RTL — slides from the right */
      top: 0;
      height: 100%;
      height: 100dvh;
      width: 82%;
      max-width: 300px;
      z-index: 60;
      transform: translateX(100%);
      transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: -6px 0 32px rgba(0,0,0,0.18);
      border-left: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .sidebar.open { transform: translateX(0); }
    .main { padding: 20px 16px 72px; max-width: 100%; }
    .lesson-header h1 { font-size: 24px; }
    .content h1 { font-size: 22px; }
    .content h2 { font-size: 18px; }
    .content p { font-size: 15px; }
    .file-card-header { padding: 12px 14px; gap: 10px; }
    .file-icon { width: 36px; height: 36px; }
    .file-name { font-size: 14px; }
    .file-sub { font-size: 12px; }
    .file-body iframe, .file-body video { height: 52vw; min-height: 220px; max-height: none; }
    .lesson-nav { flex-direction: column; }
    .nav-btn { width: 100%; }
    .topbar { padding: 10px 14px; }
    .topbar h1 { font-size: 14px; }
    .topbar .author { font-size: 11px; }
    .topbar .logo { width: 32px; height: 32px; font-size: 14px; }
    .mark-done-btn { width: 100%; justify-content: center; }
  }

  @media (max-width: 480px) {
    .file-body iframe, .file-body video { height: 56vw; min-height: 200px; }
    .lesson-header h1 { font-size: 20px; }
    .main { padding: 16px 12px 72px; }
  }

  /* Mark done button */
  .mark-done-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 32px;
    padding: 10px 20px;
    border: 1px solid var(--line);
    background: var(--paper);
    border-radius: 4px;
    cursor: pointer;
    font: inherit;
    font-size: 14px;
    font-weight: 500;
    box-shadow: var(--shadow-sm);
    transition: transform 0.12s, box-shadow 0.12s, background 0.12s;
  }
  .mark-done-btn:hover { transform: translate(-2px,-2px); box-shadow: var(--shadow); }
  .mark-done-btn.done { background: var(--green); color: white; border-color: var(--green); }
  .mark-done-btn.done:hover { box-shadow: var(--shadow); }
</style>
</head>

/* =====================================================================
   RENDER
===================================================================== */
function fmtDuration(sec) {
  if (!sec) return "";
  const m = Math.floor(sec / 60);
  const s = String(sec % 60).padStart(2, "0");
  return `${m}:${s}`;
}
function fmtSize(bytes) {
  if (!bytes) return "";
  if (bytes >= 1e6) return (bytes / 1e6).toFixed(0) + " MB";
  if (bytes >= 1e3) return (bytes / 1e3).toFixed(0) + " KB";
  return bytes + " B";
}
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

function renderFile(id) {
  const f = FILES[id];
  if (!f) return `<div class="file-card"><div class="file-placeholder">ملف غير معروف: ${escapeHtml(id)}</div></div>`;
  const isVideo = !f.is_pdf && f.ext !== "PDF";
  const iconClass = isVideo ? "video" : "pdf";
  const iconText = f.ext || (isVideo ? "VID" : "FILE");
  const sub = [
    f.duration ? fmtDuration(f.duration) : null,
    fmtSize(f.size)
  ].filter(Boolean).join(" • ");

  let body;
  // For local file paths, check that the file is plausibly present (we trust the URL but expose a helpful error on 404 via onerror)
  if (!f.url) {
    body = `<div class="file-placeholder">
      <strong>الملف غير متوفر بعد</strong>
      ضع الملف في المجلد <code dir="ltr">media/</code> ثم حدّث الصفحة
      <code dir="ltr">${escapeHtml(id)}</code>
    </div>`;
  } else if (isVideo) {
    // Direct .mp4/.webm/.mov → HTML5 video, otherwise iframe (Vimeo/YouTube/etc.)
    if (/\.(mp4|webm|mov)(\?|$)/i.test(f.url)) {
      body = `<video controls preload="metadata" controlsList="nodownload" src="${escapeHtml(f.url)}" onerror="this.parentElement.innerHTML='<div class=&quot;file-placeholder&quot;><strong>تعذّر تحميل الملف</strong>تأكد أن <code dir=&quot;ltr&quot;>${escapeHtml(f.url)}</code> موجود</div>'"></video>`;
    } else {
      body = `<iframe src="${escapeHtml(f.url)}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`;
    }
  } else {
    // PDF — iframe loads PDF natively in browsers; supports Google Drive preview URLs too
    let pdfSrc = f.url;
    if (/drive\.google\.com\/file\/d\/[^/]+\/view/.test(pdfSrc)) {
      pdfSrc = pdfSrc.replace(/\/view.*$/, "/preview");
    }
    body = `<iframe src="${escapeHtml(pdfSrc)}" allowfullscreen></iframe>`;
  }

  return `
    <div class="file-card" data-id="${escapeHtml(id)}">
      <div class="file-card-header">
        <div class="file-icon ${iconClass}">${escapeHtml(iconText)}</div>
        <div class="file-info">
          <div class="file-name">${escapeHtml(f.name)}.${escapeHtml((f.ext || '').toLowerCase())}</div>
          <div class="file-sub">${escapeHtml(sub)}</div>
        </div>
        <button class="file-toggle" data-toggle>إخفاء</button>
      </div>
      <div class="file-body">${body}</div>
    </div>
  `;
}

function renderBlocks(blocks) {
  return blocks.map(b => {
    switch (b.type) {
      case "h1": return `<h1 style="${b.bold === false ? '' : 'font-weight:700;'}">${escapeHtml(b.text)}</h1>`;
      case "h2": return `<h2 style="${b.bold ? 'font-weight:700;' : ''}">${escapeHtml(b.text)}</h2>`;
      case "h3": {
        let styles = "";
        if (b.bold) styles += "font-weight:700;";
        if (b.underline) styles += "text-decoration:underline;text-underline-offset:4px;";
        return `<h3 style="${styles}">${escapeHtml(b.text)}</h3>`;
      }
      case "p": return `<p>${escapeHtml(b.text)}</p>`;
      case "p_link": return `<p><a href="${escapeHtml(b.href)}" style="${b.bold ? 'font-weight:700;' : ''}">${escapeHtml(b.text)}</a></p>`;
      case "hr": return `<hr>`;
      case "file": return renderFile(b.id);
      case "image": {
        let html = `<figure><img src="${escapeHtml(b.src)}" alt="">`;
        if (b.caption) html += `<figcaption class="image-caption">${escapeHtml(b.caption)}</figcaption>`;
        html += `</figure>`;
        return html;
      }
      case "cta":
        return `<div><a class="cta" href="${escapeHtml(b.href)}" target="_blank" rel="noopener">${escapeHtml(b.text)} ←</a></div>`;
      case "button_row":
        return `<div class="button-row">${b.buttons.map(btn =>
          `<a class="cta secondary" href="${escapeHtml(btn.href)}" target="_blank" rel="noopener">${escapeHtml(btn.text)}</a>`
        ).join("")}</div>`;
      case "bonus":
        return `
          <div class="bonus-item">
            <h3>${escapeHtml(b.name)}</h3>
            <p>${escapeHtml(b.desc)}</p>
            <a href="${escapeHtml(b.url)}" target="_blank" rel="noopener">${escapeHtml(b.url)}</a>
          </div>
        `;
      case "notice":
        return `
          <div class="notice">
            <h4>${escapeHtml(b.title)}</h4>
            <p>${escapeHtml(b.body).replace(/\n/g, "<br>")}</p>
          </div>
        `;
      default:
        return "";
    }
  }).join("");
}

function loadProgress() {
  try { return JSON.parse(localStorage.getItem("course_progress") || "{}"); }
  catch { return {}; }
}
function saveProgress(p) {
  try { localStorage.setItem("course_progress", JSON.stringify(p)); } catch {}
}

function updateProgressBar() {
  const progress = loadProgress();
  const done = Object.values(progress).filter(Boolean).length;
  const total = PAGES.length;
  const pct = total ? Math.round(done / total * 100) : 0;
  const fill = document.getElementById("progressFill");
  const label = document.getElementById("progressLabel");
  if (fill) fill.style.width = pct + "%";
  if (label) label.textContent = done + " / " + total;
}

function renderSidebar(currentIdx) {
  const progress = loadProgress();
  const list = document.getElementById("lessonList");
  list.innerHTML = PAGES.map((p, i) => `
    <li>
      <button data-idx="${i}" class="${i === currentIdx ? 'active' : ''} ${progress[i] ? 'done' : ''}">
        <span class="lesson-num">${i + 1}</span>
        <span class="lesson-title" title="${escapeHtml(p.title)}">${escapeHtml(p.title)}</span>
        <span class="check">✓</span>
      </button>
    </li>
  `).join("");
  list.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      goTo(parseInt(btn.dataset.idx, 10));
      closeSidebar();
    });
  });
  // Scroll active item into view inside sidebar
  const activeBtn = list.querySelector("button.active");
  if (activeBtn) activeBtn.scrollIntoView({ block: "nearest" });
  updateProgressBar();
}

function renderLesson(idx) {
  const p = PAGES[idx];
  const main = document.getElementById("main");
  const total = PAGES.length;
  const prevIdx = idx - 1;
  const nextIdx = idx + 1;

  const isDone = !!loadProgress()[idx];
  main.innerHTML = `
    <div class="lesson-header">
      <div class="lesson-meta">الدرس ${idx + 1} من ${total}</div>
      <h1>${escapeHtml(p.title)}</h1>
    </div>
    <div class="content">${renderBlocks(p.blocks)}</div>
    <button class="mark-done-btn ${isDone ? 'done' : ''}" id="markDoneBtn">
      ${isDone ? '✓ تم إنهاء الدرس' : '✓ وضع علامة كمكتمل'}
    </button>
    <nav class="lesson-nav">
      <button class="nav-btn ${prevIdx < 0 ? 'disabled' : ''}" data-go="${prevIdx}">
        <span class="arrow">→</span>
        <span>
          <div class="label">السابق</div>
          <div class="target">${prevIdx >= 0 ? escapeHtml(PAGES[prevIdx].title) : '—'}</div>
        </span>
      </button>
      <button class="nav-btn ${nextIdx >= total ? 'disabled' : ''}" data-go="${nextIdx}">
        <span>
          <div class="label">التالي</div>
          <div class="target">${nextIdx < total ? escapeHtml(PAGES[nextIdx].title) : '—'}</div>
        </span>
        <span class="arrow">←</span>
      </button>
    </nav>
  `;

  // Wire up mark-done toggle
  const markBtn = main.querySelector("#markDoneBtn");
  markBtn.addEventListener("click", () => {
    const p2 = loadProgress();
    const nowDone = !p2[idx];
    p2[idx] = nowDone;
    saveProgress(p2);
    markBtn.classList.toggle("done", nowDone);
    markBtn.textContent = nowDone ? '✓ تم إنهاء الدرس' : '✓ وضع علامة كمكتمل';
    renderSidebar(idx);
  });

  // Wire up nav
  main.querySelectorAll(".nav-btn[data-go]").forEach(btn => {
    btn.addEventListener("click", () => {
      const t = parseInt(btn.dataset.go, 10);
      if (t >= 0 && t < total) goTo(t);
    });
  });

  // Wire up file toggle (show/hide)
  main.querySelectorAll("[data-toggle]").forEach(btn => {
    btn.addEventListener("click", () => {
      const body = btn.closest(".file-card").querySelector(".file-body");
      const isClosed = body.classList.toggle("closed");
      btn.textContent = isClosed ? "عرض" : "إخفاء";
    });
  });

  // scroll to top
  window.scrollTo({ top: 0, behavior: "instant" });
}

function goTo(idx) {
  if (idx < 0 || idx >= PAGES.length) return;
  history.replaceState(null, "", "#lesson-" + (idx + 1));
  renderSidebar(idx);
  renderLesson(idx);
}

function initial() {
  let idx = 0;
  const m = location.hash.match(/^#lesson-(\d+)$/);
  if (m) {
    const n = parseInt(m[1], 10) - 1;
    if (n >= 0 && n < PAGES.length) idx = n;
  }
  goTo(idx);
}

// Mobile sidebar
const menuBtn = document.getElementById("menuBtn");
const sidebar = document.getElementById("sidebar");
const scrim   = document.getElementById("scrim");
function openSidebar()  { sidebar.classList.add("open");  scrim.classList.add("show"); }
function closeSidebar() { sidebar.classList.remove("open"); scrim.classList.remove("show"); }
menuBtn.addEventListener("click", openSidebar);
scrim.addEventListener("click", closeSidebar);

// Keyboard nav
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") {
    // In RTL, right arrow = previous
    const active = document.querySelector(".lesson-list button.active");
    if (active) goTo(Math.max(0, parseInt(active.dataset.idx, 10) - 1));
  } else if (e.key === "ArrowLeft") {
    const active = document.querySelector(".lesson-list button.active");
    if (active) goTo(Math.min(PAGES.length - 1, parseInt(active.dataset.idx, 10) + 1));
  }
});

initial();
</script>
